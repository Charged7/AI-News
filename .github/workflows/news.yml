name: Daily News Feed

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send important news cards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_SUMMARY_BATCH_SIZE: ${{ vars.OPENAI_SUMMARY_BATCH_SIZE }}
          OPENAI_SUMMARY_MAX_TOKENS: ${{ vars.OPENAI_SUMMARY_MAX_TOKENS }}
          OPENAI_IMPACT_BATCH_SIZE: ${{ vars.OPENAI_IMPACT_BATCH_SIZE }}
          OPENAI_IMPACT_MAX_TOKENS: ${{ vars.OPENAI_IMPACT_MAX_TOKENS }}
          NEWS_LOOKBACK_HOURS: ${{ vars.NEWS_LOOKBACK_HOURS }}
          NEWS_MIN_IMPACT_SCORE: ${{ vars.NEWS_MIN_IMPACT_SCORE }}
          NEWS_MAX_ITEMS_PER_RUN: ${{ vars.NEWS_MAX_ITEMS_PER_RUN }}
          NEWS_SOURCES_PATH: ${{ vars.NEWS_SOURCES_PATH }}
          NEWS_STATE_DB_PATH: ${{ vars.NEWS_STATE_DB_PATH }}
          SENT_NEWS_PATH: ${{ vars.SENT_NEWS_PATH }}
          PROCESSED_NEWS_PATH: ${{ vars.PROCESSED_NEWS_PATH }}
        run: python main.py

      - name: Commit news history
        if: always()
        run: |
          if [ -z "$(git status --short -- data/newsbot.db data/sent_news.json data/processed_news.json)" ]; then
            echo "No news history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data
          git commit -m "Update news history"
          git push
