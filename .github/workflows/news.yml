name: Daily News Feed

permissions:
  contents: write

on:
  # Щогодинний розклад; GitHub може запускати його із затримкою.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send scheduled news cards
        env:
          # Секрети для Telegram та OpenAI підтягуються з GitHub repository settings.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_SUMMARY_BATCH_SIZE: ${{ vars.OPENAI_SUMMARY_BATCH_SIZE }}
          OPENAI_SUMMARY_MAX_TOKENS: ${{ vars.OPENAI_SUMMARY_MAX_TOKENS }}
          NEWS_LOOKBACK_HOURS: ${{ vars.NEWS_LOOKBACK_HOURS }}
        run: python main.py

      - name: Commit sent news history
        if: always()
        run: |
          # Комітимо історію тільки якщо JSON справді змінився.
          if git diff --quiet -- data/sent_news.json; then
            echo "No sent news history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_news.json
          git commit -m "Update sent news history"
          git push
